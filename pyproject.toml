[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chase-task-scheduling"
version = "0.1.0"
description = "CHASE task scheduling experiments"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
chase-exp = "after_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["archive", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E401", "E402", "E501", "E701", "E722", "E741", "F401", "F541", "F841", "I001"]
